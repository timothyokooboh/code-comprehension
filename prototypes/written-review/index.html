<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>__TITLE__</title>
<style>
:root{font-family:system-ui,sans-serif;color:#222321;background:#f8f8f4}*{box-sizing:border-box}body{margin:0}main{max-width:760px;margin:6vh auto;padding:28px}small{font-family:monospace;color:#62665b}h1{font-size:clamp(28px,5vw,42px);letter-spacing:-.04em}p{line-height:1.65}#question{font-size:20px;border-top:1px solid #d8d9d4;padding-top:28px}label{display:block;font-weight:600;margin:20px 0 10px}textarea{width:100%;min-height:180px;padding:16px;font:inherit;line-height:1.6;border:1px solid #92978a;border-radius:6px;resize:vertical;background:white}button{margin-top:16px;background:#242622;color:#e3f86b;border:0;border-radius:4px;padding:14px 20px;font:inherit;font-weight:600;cursor:pointer;transition:background-color 150ms ease}button:disabled{opacity:.45;cursor:not-allowed}button:enabled:hover{background:#414638}:focus-visible{outline:3px solid #799200;outline-offset:3px}#status{font-size:14px;color:#535a49}#feedback{margin-top:28px;padding:24px;border-left:4px solid #a9c526;background:#eff3df}#verdict{margin-top:0}code{overflow-wrap:anywhere}#error{color:#9a2d25}[hidden]{display:none!important}
fieldset{border:0;border-top:1px solid #d8d9d4;padding:24px 0;margin-top:30px;min-width:0}legend{font-weight:600;font-size:19px;line-height:1.5}label.option{display:flex;align-items:baseline;gap:12px;background:white;border:1px solid #d8d9d4;padding:14px;font-weight:400;border-radius:4px}article{border-top:1px solid #cbd4b7;margin-top:20px;padding-top:12px}h4{margin-bottom:8px}#results-title{scroll-margin-top:24px}#feedback{margin-bottom:32px}</style></head><body><main>
<small id="eyebrow"></small><h1 id="heading"></h1><p id="introduction"></p>
<p id="status" role="status"></p><p id="error" role="alert"></p>
<section id="feedback" hidden aria-live="polite" aria-labelledby="results-title"><h2 id="results-title" tabindex="-1"></h2><div id="result-content"></div></section>
<form id="form"><div id="questions"></div><button id="submit" type="submit" disabled></button></form>
</main><script type="module" src="/browser.mjs"></script></body></html>
